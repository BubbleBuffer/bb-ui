name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: dart format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - name: Save a format patch
        if: failure()
        run: dart format . && git diff > format.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: format-patch
          path: format.patch
          if-no-files-found: ignore

  analyze:
    name: flutter analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # The bb_lints plugin is loaded from packages/bb_lints by path. Only
      # `dart analyze` reports analyzer-plugin diagnostics; `flutter analyze`
      # (3.47) does not, so it would pass with every rule broken.
      - run: dart pub get
        working-directory: packages/bb_lints
      - run: dart analyze --fatal-infos

  lints:
    name: bb_lints package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - working-directory: packages/bb_lints
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

  colours:
    name: colour drift and raw colours
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: Regenerate colours
        working-directory: packages/bb_tokens
        run: dart tool/generate_colors.dart
      - name: Fail on generated colour drift
        run: git diff --exit-code -- packages/bb_tokens/lib/src/colors.g.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: regenerated-colours
          path: packages/bb_tokens/lib/src/colors.g.dart

  test:
    name: tests (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: bb_tokens, dir: packages/bb_tokens}
          - {package: bb_ui, dir: packages/bb_ui}
          - {package: gallery, dir: apps/gallery}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: Run non-golden tests
        working-directory: ${{ matrix.dir }}
        run: flutter test --exclude-tags golden

  goldens:
    name: primitive goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: Compare committed baselines (missing PNGs fail)
        if: github.event_name != 'workflow_dispatch'
        working-directory: apps/gallery
        run: flutter test --tags golden
      - name: Test gallery and render golden candidates
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/gallery
        run: |
          flutter test --exclude-tags golden
          flutter test --tags golden --update-goldens
      - name: Collect candidates and rendering environment
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p shots/test/goldens
          cp apps/gallery/test/goldens/primitives_*.png shots/test/goldens/
          cp apps/gallery/test/goldens/search_*.png shots/test/goldens/
          cp apps/gallery/test/goldens/palette_*.png shots/test/goldens/
          cp apps/gallery/test/goldens/devices_*.png shots/test/goldens/
          cp apps/gallery/test/goldens/session_*.png shots/test/goldens/
          git rev-parse HEAD > shots/commit.txt
          flutter --version > shots/flutter-version.txt
          cat /etc/os-release > shots/os-release.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: primitive-golden-candidates
          path: shots
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: golden-failures
          path: apps/gallery/test/failures
          if-no-files-found: ignore

  gallery-web:
    name: build gallery web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - working-directory: apps/gallery
        run: flutter build web --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: primitives-gallery-web
          path: apps/gallery/build/web

  git-consumer:
    name: git dependency resolves
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Resolve and analyze a consumer at this commit
        env:
          URL: https://github.com/${{ github.repository }}.git
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/consumer"
          mkdir -p "$dir/lib"
          cat > "$dir/pubspec.yaml" <<YAML
          name: consumer
          publish_to: none
          environment:
            sdk: ^3.13.4
          dependencies:
            flutter:
              sdk: flutter
            bb_ui:
              git:
                url: $URL
                ref: $REF
                path: packages/bb_ui
          YAML
          printf "import 'package:bb_ui/bb_ui.dart';\n\nfinal colors = AppColors.light;\nconst hint = AppTooltip.hoverDelay;\n" > "$dir/lib/ui_use.dart"
          printf "import 'package:bb_ui/tokens.dart';\n\nconst radius = Radii.md;\n" > "$dir/lib/tokens_use.dart"
          cat > "$dir/analysis_options.yaml" <<YAML
          plugins:
            bb_lints:
              git:
                url: $URL
                ref: $REF
                path: packages/bb_lints
          YAML
          cd "$dir"
          flutter pub get
          dart analyze --fatal-infos
          # The plugin loads from Git and reports a raw value.
          printf "import 'package:flutter/widgets.dart';\n\nconst pad = EdgeInsets.all(10);\n" > lib/raw.dart
          if out=$(dart analyze 2>&1); then
            echo "expected bb_lints to flag lib/raw.dart" >&2
            exit 1
          fi
          echo "$out" | grep -q 'tokens_only' || { echo "$out" >&2; exit 1; }
